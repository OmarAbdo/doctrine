# Doctrine checks itself with its own gates on every pull request and on main.
name: self

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  self:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned tools and doctrine
        run: |
          python -m pip install --require-hashes -r requirements/tools.txt
          python -m pip install --no-deps -e .
      - name: Every rule on doctrine itself
        run: doctrine check
      - name: Every bad sample and bypass attempt is caught
        run: |
          doctrine selftest | tee selftest.txt
          test "$(tail -n 1 selftest.txt)" = "1"
      - name: Pull request gates
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          doctrine ci scope --base origin/${{ github.event.pull_request.base.ref }}
          doctrine ci red-first --base origin/${{ github.event.pull_request.base.ref }}
          doctrine ci coverage --base origin/${{ github.event.pull_request.base.ref }}
          doctrine ci description --base origin/${{ github.event.pull_request.base.ref }}
          doctrine ci evals --base origin/${{ github.event.pull_request.base.ref }}
          doctrine ci goalposts --base origin/${{ github.event.pull_request.base.ref }}

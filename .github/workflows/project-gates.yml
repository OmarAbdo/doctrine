# Doctrine's gates for a project's pull request. Projects call this workflow from their own
# .github/workflows/doctrine.yml, pinned to a doctrine release tag.
name: project-gates

on:
  workflow_call:
    inputs:
      doctrine_ref:
        description: The doctrine release the project is pinned to (its doctrine_version).
        type: string
        required: true
    secrets:
      doctrine_token:
        description: Read access to the doctrine repository while it is private.
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        with:
          repository: OmarAbdo/doctrine
          ref: ${{ inputs.doctrine_ref }}
          path: .doctrine-home
          token: ${{ secrets.doctrine_token || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned tools and doctrine
        run: |
          python -m pip install --require-hashes -r .doctrine-home/requirements/tools.txt
          python -m pip install --no-deps -e .doctrine-home
      - name: Every rule on every service
        run: doctrine check
      - name: The item's scope and size
        run: doctrine ci scope --base origin/${{ github.event.pull_request.base.ref }}
      - name: New tests fail on the code before the item
        run: doctrine ci red-first --base origin/${{ github.event.pull_request.base.ref }}
      - name: Changed lines are tested
        run: doctrine ci coverage --base origin/${{ github.event.pull_request.base.ref }}
      - name: The description says what changed, why, the proof and what is not verified
        run: doctrine ci description --base origin/${{ github.event.pull_request.base.ref }}
      - name: A changed prompt or eval set brings a recorded run that holds up
        env:
          GH_TOKEN: ${{ github.token }}
        run: doctrine ci evals --base origin/${{ github.event.pull_request.base.ref }}
      - name: Goalposts unchanged, or approved by the approver
        env:
          GH_TOKEN: ${{ github.token }}
        run: doctrine ci goalposts --base origin/${{ github.event.pull_request.base.ref }}

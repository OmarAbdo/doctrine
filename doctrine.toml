# Doctrine's own contract: doctrine is built under its own rules.

[project]
name = "doctrine"
doctrine_version = "0.1.0"
approver = "OmarAbdo"

[outcome]
# Share of the attack and bad-sample cases doctrine catches (doctrine selftest), 0 to 1.
metric = "share of attacks and bad samples caught"
command = ["python", "-m", "doctrine", "selftest"]
baseline = 1
stop_below = 1

[[services]]
name = "doctrine"
path = "src/doctrine"
profile = "python"
architecture = "hexagonal"
tests = "tests"

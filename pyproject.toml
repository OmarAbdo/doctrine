[project]
name = "doctrine"
version = "0.3.0"
description = "The rules every project starts from, enforced by machinery Claude Code can't loosen."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
doctrine = "doctrine.adapters.cli.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doctrine = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q --strict-markers --import-mode=importlib"

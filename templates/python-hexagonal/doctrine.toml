# This project's contract. Making anything here looser needs the approver's approval on the pull request.

[project]
name = "{{name}}"
doctrine_version = "{{version}}"
approver = "{{approver}}"

[outcome]
# The one number this project exists to move, computed from real data. Agree it with the approver
# before the first feature: the first work item defines it.
metric = "not defined yet"
command = ["python", "-m", "{{package}}.adapters.outcome"]
baseline = 1
stop_below = 0.8

[[services]]
name = "{{package}}"
path = "src/{{package}}"
profile = "python"
architecture = "hexagonal"
tests = "tests"

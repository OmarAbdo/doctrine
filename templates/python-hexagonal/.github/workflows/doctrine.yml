# Doctrine's gates on every pull request. This file is guarded: changing it needs the approver.
name: doctrine

on:
  pull_request:

jobs:
  gates:
    uses: {{doctrine_repository}}/.github/workflows/project-gates.yml@v{{version}}
    with:
      doctrine_ref: v{{version}}
    secrets:
      doctrine_token: ${{ secrets.DOCTRINE_TOKEN }}
